[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-cst-studio"
version = "0.2.1"
description = "MCP server for CST Studio Suite: antenna design, RF simulation, and PCB layout"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "RFingAdam" },
]
keywords = ["mcp", "cst", "antenna", "rf", "simulation", "electromagnetic", "pcb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "mcp>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/RFingAdam/mcp-cst-studio"
Repository = "https://github.com/RFingAdam/mcp-cst-studio"
Issues = "https://github.com/RFingAdam/mcp-cst-studio/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
mcp-cst-studio = "mcp_cst_studio.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_cst_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
